# Keep the existing layer name, collection, and recipe directories.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "lockdown"
BBFILE_PATTERN_lockdown = "^${LAYERDIR}/"
BBFILE_PRIORITY_lockdown = "10"
LAYERDEPENDS_lockdown = "core"
LAYERSERIES_COMPAT_lockdown = "scarthgap"
