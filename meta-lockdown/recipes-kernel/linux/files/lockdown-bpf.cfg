# BPF framework, BPF-LSM and CO-RE: qemuarm64 Scarthgap demonstration.

# 1. Core BPF Features
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y

# 2. Security Hooks
CONFIG_CGROUP_BPF=y
CONFIG_BPF_LSM=y
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
CONFIG_LSM="lockdown,yama,bpf"

# 3. BTF / CO-RE Support
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
